name: Publish to npm

# Publishes token-diet to the npm registry WITH provenance, via OIDC trusted publishing
# (no NPM_TOKEN secret needed).
#
# ONE-TIME SETUP on npmjs.com before the first run:
#   1. Sign in to npmjs.com as the package owner.
#   2. Reserve / create the `token-diet` package (or, for an existing one, open its Settings).
#   3. Under "Trusted Publisher", add a GitHub Actions publisher pointing at:
#         repository: KasperChenGH/token-diet   workflow: publish.yml
#   The repository.url in package.json already matches this repo (required for provenance).
#
# After that, run this workflow manually: Actions tab -> "Publish to npm" -> "Run workflow".
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance / OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm that supports OIDC trusted publishing
        run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --provenance --access public
