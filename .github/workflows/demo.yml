name: Demo GIF

# Renders the README demo GIF in CI (no local tooling needed) and commits docs/demo.gif.
# Runs on demand, or when the demo kit changes. Commit message carries [skip ci] so it can't loop.
on:
  workflow_dispatch:
  push:
    paths:
      - 'demo/**'
      - '.github/workflows/demo.yml'

permissions:
  contents: write

concurrency:                 # don't let two triggers race on the docs/demo.gif commit
  group: demo-gif
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # vhs-action's bundled ffmpeg installer is flaky, so install vhs + ttyd + ffmpeg directly.
      - name: Install vhs + ttyd + ffmpeg
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y vhs
          vhs --version && ttyd --version && ffmpeg -version | head -1
      - name: Build the wasteful fixture
        run: node demo/make-fixture.js
      - run: mkdir -p docs   # vhs needs the output dir to exist
      - name: Render the demo GIF
        run: vhs demo/token-diet.tape
      - name: Commit docs/demo.gif if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          if git diff --staged --quiet; then
            echo "No change in docs/demo.gif"
          else
            git commit -m "chore(demo): re-render docs/demo.gif [skip ci]"
            git push
          fi
